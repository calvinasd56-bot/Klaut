        colors: {

<style>
  html,body{background:#0a0a0a;color:#fff;font-family:'Inter',ui-sans-serif,system-ui;}
  .prose{ font-size: 1.05rem; line-height: 1.75; color:#d4d4d8; }
  .prose p{ margin: 0 0 1.1em; }
  .prose h1{ font-size: 2rem; font-weight: 700; margin: 1.6em 0 0.6em; color:#fff; }
  .prose h2{ font-size: 1.6rem; font-weight: 700; margin: 1.6em 0 0.5em; color:#fff; }
  .prose h3{ font-size: 1.25rem; font-weight: 600; margin: 1.4em 0 0.4em; color:#fff; }
  .prose ul, .prose ol{ padding-left: 1.5em; margin: 0 0 1.2em; }
  .prose ul{ list-style: disc; }
  .prose ol{ list-style: decimal; }
  .prose li{ margin: 0.4em 0; }
  .prose a{ color:#818cf8; text-decoration: underline; text-underline-offset: 3px; }
  .prose a:hover{ color:#a5b4fc; }
  .prose strong{ color:#fff; }
  .prose img{ max-width: 100%; border-radius: 10px; margin: 1.5em 0; border:1px solid #262626; }
  .prose blockquote{ border-left: 3px solid #6366f1; padding-left: 1.1em; color:#a1a1aa; margin: 1.4em 0; font-style: italic; }
  .prose pre{ background:#111; border:1px solid #262626; padding: 1em 1.2em; border-radius:10px; font-family:'JetBrains Mono',monospace; font-size:0.9em; overflow-x:auto; margin: 1.4em 0; }
  .prose code{ background:#1a1a1a; padding:0.15em 0.4em; border-radius:4px; font-family:'JetBrains Mono',monospace; font-size:0.9em; }
  .prose pre code{ background:transparent; padding:0; }
  .prose hr{ border:0; border-top:1px solid #262626; margin: 2em 0; }
</style>

  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

</head>
<body class="min-h-screen flex flex-col">

<header class="border-b border-line">
  <div class="max-w-7xl mx-auto px-6 lg:px-10 h-16 flex items-center justify-between">
    <a href="/id/" class="flex items-center gap-2.5">
      <img src="/klaut-K.svg" alt="" class="h-7 w-7"/>
    </a>
    <nav class="hidden md:flex items-center gap-1">
      <a href="/id/#about"        class="px-4 py-2 text-sm text-muted hover:text-ink">Tentang</a>
      <a href="/id/#industries"   class="px-4 py-2 text-sm text-muted hover:text-ink">Studi Kasus</a>
      <a href="/id/artikel"       class="px-4 py-2 text-sm text-white">Artikel</a>
      <a href="/id/faq"           class="px-4 py-2 text-sm text-muted hover:text-ink">FAQ</a>
    </nav>
    <div class="flex items-center gap-3">
      <div class="flex items-center rounded-full border border-white/10 bg-white/5 p-0.5 text-xs font-medium">
        <a href="/id/artikel"       class="px-3 py-1.5 rounded-full bg-white/10 text-white">ID</a>
        <a id="lang-en-link" href="/articles" class="px-3 py-1.5 rounded-full text-muted hover:text-white">EN</a>
      </div>
    </div>
  </div>
</header>

<main class="flex-1">
  <article id="article" class="max-w-3xl mx-auto px-6 lg:px-8 pt-12 pb-24 hidden">
    <a href="/id/artikel" class="text-sm text-muted hover:text-ink">← Semua artikel</a>

    <div id="cover-wrap" class="mt-6 rounded-2xl overflow-hidden border border-line hidden">
      <img id="cover-img" alt="" class="w-full aspect-[16/9] object-cover"/>
    </div>

    <div id="date" class="mt-8 text-xs font-mono uppercase tracking-widest text-accent-2"></div>
    <h1 id="title" class="mt-3 text-3xl md:text-4xl font-bold tracking-tight leading-tight"></h1>
    <p id="excerpt" class="mt-4 text-lg text-muted leading-relaxed"></p>

    <hr class="my-8 border-line"/>

    <div id="content" class="prose"></div>

    <section id="featured-in" class="mt-16 border-t border-line pt-10 hidden">
      <div class="text-xs font-mono uppercase tracking-widest text-accent-2 mb-4">Dibahas di case study</div>
      <div id="featured-in-list" class="grid sm:grid-cols-2 gap-4"></div>
    </section>

    <div class="mt-16 border-t border-line pt-8 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <a href="/id/artikel" class="text-sm text-muted hover:text-ink">← Semua artikel</a>
      <a href="/id/#cta" class="text-sm text-accent-2 hover:text-white">Bicara dengan tim Klaut →</a>
    </div>
  </article>

  <div id="loading" class="max-w-3xl mx-auto px-6 lg:px-8 pt-24 pb-24 text-center text-dim">Memuat artikel…</div>

  <div id="notfound" class="max-w-3xl mx-auto px-6 lg:px-8 pt-24 pb-24 text-center hidden">
    <div class="text-6xl mb-4">404</div>
    <h1 class="text-2xl font-bold mb-2">Artikel tidak ditemukan</h1>
    <p class="text-muted">Artikel yang Anda cari tidak ada atau belum dipublikasikan.</p>
    <a href="/id/artikel" class="inline-block mt-6 px-4 py-2 rounded-lg bg-accent hover:bg-accent-deep">Lihat semua artikel</a>
  </div>
</main>

<footer class="border-t border-line">
  <div class="max-w-7xl mx-auto px-6 lg:px-10 py-10 flex flex-col md:flex-row md:items-center md:justify-between gap-4 text-xs text-dim">
    <div class="flex items-center gap-2.5">
      <img src="/klaut-K.svg" alt="" class="h-6 w-6"/>
      <span>© 2026 Klaut AI</span>
    </div>
    <div class="flex gap-6">
      <a href="/id/" class="hover:text-ink">Beranda</a>
      <a href="/id/faq" class="hover:text-ink">FAQ</a>
      <a href="mailto:hello@klaut.id" class="hover:text-ink">Kontak</a>
    </div>
  </div>
</footer>

<script type="module">
import { supabase, tiptapToHtml, formatDate, readingTime } from "/shared/supabase.js";

// Extract slug from URL: /artikel/<slug>  (after Vercel rewrite, location.pathname keeps the original URL)
const match = location.pathname.match(/^\/artikel\/([^\/]+)/);
const slug  = match ? decodeURIComponent(match[1]) : null;

const loading = document.getElementById("loading");
const article = document.getElementById("article");
const notfound = document.getElementById("notfound");

function show(el){ el.classList.remove("hidden"); }
function hide(el){ el.classList.add("hidden"); }

function escapeAttr(s){ return String(s ?? "").replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

if (!slug) {
  hide(loading); show(notfound);
} else {
  const { data, error } = await supabase
    .from("articles")
    .select("*")
    .eq("slug", slug)
    .eq("published", true)
    .maybeSingle();

  hide(loading);

  if (error || !data) {
    show(notfound);
  } else {
    document.documentElement.lang = "id";

    // SEO fields with fallbacks
    const pageTitle = (data.seo_title_id || data.title_id) + " — Klaut";
    const pageDesc  = data.seo_description_id || data.excerpt_id || "";
    const author    = (data.author && data.author.trim()) || "Klaut";
    const mins      = readingTime(data.content_id);

    document.title = pageTitle;
    document.getElementById("meta-desc").setAttribute("content", pageDesc);
    document.getElementById("meta-og-title").setAttribute("content", pageTitle);
    document.getElementById("meta-og-desc").setAttribute("content", pageDesc);
    document.getElementById("meta-canonical").setAttribute("href", `https://klaut.id/id/artikel/${data.slug}`);
    if (data.cover_image_url) document.getElementById("meta-og-image").setAttribute("content", data.cover_image_url);

    // Noindex meta if requested
    if (data.noindex) {
      const robots = document.createElement("meta");
      robots.name = "robots";
      robots.content = "noindex, nofollow";
      document.head.appendChild(robots);
    }

    // Only show EN link if EN version exists
    if (!data.title_en) {
      document.getElementById("lang-en-link").style.display = "none";
    } else {
      document.getElementById("lang-en-link").href = `/articles/${data.slug}`;
    }

    if (data.cover_image_url) {
      document.getElementById("cover-img").src = data.cover_image_url;
      document.getElementById("cover-img").alt = data.title_id;
      show(document.getElementById("cover-wrap"));
    }
    const dateStr = formatDate(data.published_at);
    const parts = [dateStr];
    if (mins) parts.push(`${mins} menit baca`);
    if (author && author !== "Klaut") parts.push(`oleh ${author}`);
    document.getElementById("date").textContent = parts.join(" · ");
    document.getElementById("title").textContent = data.title_id;
    if (data.excerpt_id) {
      document.getElementById("excerpt").textContent = data.excerpt_id;
    } else {
      document.getElementById("excerpt").style.display = "none";
    }
    document.getElementById("content").innerHTML = tiptapToHtml(data.content_id);

    // JSON-LD — author Organization if "Klaut", else Person
    const authorLd = author === "Klaut"
      ? { "@type": "Organization", "name": "Klaut" }
      : { "@type": "Person", "name": author };

    const ld = document.createElement("script");
    ld.type = "application/ld+json";
    ld.textContent = JSON.stringify({
      "@context": "https://schema.org",
      "@type": "Article",
      "headline": data.title_id,
      "description": pageDesc,
      "image": data.cover_image_url || "https://klaut.id/og-image.png",
      "datePublished": data.published_at,
      "dateModified": data.updated_at,
      "author": authorLd,
      "publisher": { "@type": "Organization", "name": "Klaut", "logo": { "@type": "ImageObject", "url": "https://klaut.id/klaut-K.png" } },
      "mainEntityOfPage": `https://klaut.id/id/artikel/${data.slug}`,
      "inLanguage": "id-ID"
    });
    document.head.appendChild(ld);

    // Featured in case study (via join table)
    const { data: rel } = await supabase
      .from("case_study_articles")
      .select("case_study_id, case_studies:case_study_id(slug, title_id, title_en, excerpt_id, doc_type, client_label, page_count, published)")
      .eq("article_id", data.id);

    const cs = (rel || []).map(r => r.case_studies).filter(c => c && c.published);
    if (cs.length) {
      const featuredIn = document.getElementById("featured-in");
      const list = document.getElementById("featured-in-list");
      const DOC_LABEL = { case_study:"Case Study", audit:"Audit", whitepaper:"Whitepaper", roadmap:"Roadmap", reference:"Reference", attestation:"Attestation", brief:"Brief", template:"Template", spec:"Spec", rubric:"Rubric", protocol:"Protocol" };
      list.innerHTML = cs.map(c => `
        <a href="/id/case-studies/${escapeAttr(c.slug)}" class="block border border-line rounded-xl bg-surface hover:border-linestrong transition p-5">
          <div class="text-[10px] font-mono uppercase tracking-widest text-accent-2 mb-2">${escapeAttr(DOC_LABEL[c.doc_type] || c.doc_type || "Dokumen")}${c.page_count ? ` · ${c.page_count} pp` : ""}</div>
          <div class="font-semibold text-base leading-snug">${escapeAttr(c.title_id || c.title_en || c.slug)}</div>
          ${c.client_label ? `<div class="text-xs text-dim mt-1">${escapeAttr(c.client_label)}</div>` : ""}
          ${c.excerpt_id ? `<p class="text-sm text-muted mt-3 line-clamp-2">${escapeAttr(c.excerpt_id)}</p>` : ""}
          <div class="mt-3 text-xs text-accent-2">Buka case study →</div>
        </a>
      `).join("");
      featuredIn.classList.remove("hidden");
    }

    show(article);
  }
}
</script>
<!-- Vercel Web Analytics -->
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
