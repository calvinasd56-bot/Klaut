<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="robots" content="noindex, nofollow"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0a0a0a;
    color: #fff;
    font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }

  /* Dot grid backdrop */
  .dot-grid {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 28px 28px;
  }

  /* Indigo orb glow */
  .orb-1 {
    position: absolute;
    width: 640px; height: 640px;
    border-radius: 9999px;
    background: radial-gradient(circle at 30% 30%, #4F6BFF, transparent 60%);
    filter: blur(80px);
    opacity: 0.55;
    top: -180px; left: -160px;
    pointer-events: none;
  }
  .orb-2 {
    position: absolute;
    width: 520px; height: 520px;
    border-radius: 9999px;
    background: radial-gradient(circle at 70% 50%, #3854E5, transparent 60%);
    filter: blur(90px);
    opacity: 0.45;
    bottom: -180px; right: -140px;
    pointer-events: none;
  }

  /* Vignette to deepen edges */
  .vignette {
    position: absolute; inset: 0;
    background:
      radial-gradient(120% 80% at 50% 50%, transparent 50%, rgba(0,0,0,0.55) 100%);
    pointer-events: none;
  }

  /* Content frame */
  .frame {
    position: absolute; inset: 56px;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 28px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0) 40%);
    padding: 64px 72px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* Top row: badge */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    border: 1px solid rgba(99,102,241,0.35);
    background: rgba(99,102,241,0.08);
    border-radius: 9999px;
    font-size: 16px;
    font-weight: 500;
    color: #c7d2fe;
    letter-spacing: 0.02em;
    width: fit-content;
  }
  .badge .dot {
    width: 8px; height: 8px;
    border-radius: 9999px;
    background: #7B8FFF;
    box-shadow: 0 0 12px #4F6BFF;
  }

  /* Center stack */
  .stack {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Wordmark */
  .wordmark {
    height: 88px;
    width: auto;
    object-fit: contain;
    object-position: left center;
    margin-bottom: 8px;
  }

  /* Headline */
  .headline {
    font-size: 72px;
    font-weight: 700;
    line-height: 1.02;
    letter-spacing: -0.02em;
    max-width: 920px;
  }
  .headline .grad {
    background: linear-gradient(90deg, #ffffff 0%, #c7d2fe 60%, #7B8FFF 100%);
    -webkit-background-clip: text;
            background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }

  /* Subtitle */
  .subtitle {
    font-size: 26px;
    font-weight: 400;
    line-height: 1.35;
    color: #a1a1aa;
    max-width: 880px;
  }
  .subtitle b { color: #e4e4e7; font-weight: 500; }

  /* Bottom row */
  .bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .pills {
    display: flex;
    gap: 10px;
  }
  .pill {
    padding: 8px 16px;
    border: 1px solid rgba(255,255,255,0.10);
    background: rgba(255,255,255,0.03);
    border-radius: 9999px;
    font-size: 15px;
    font-weight: 500;
    color: #d4d4d8;
  }
  .domain {
    font-size: 20px;
    font-weight: 600;
    color: #7B8FFF;
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>
  <div class="dot-grid"></div>
  <div class="orb-1"></div>
  <div class="orb-2"></div>
  <div class="vignette"></div>

  <div class="frame">
    <div class="badge">
      <span class="dot"></span>
      <span>Solusi AI Berkelas Enterprise</span>
    </div>

    <div class="stack">
      <img class="wordmark" src="klaut-wordmark.png" alt="Klaut"/>
      <div class="headline">
        AI Agent untuk <span class="grad">Bisnis Indonesia</span>
      </div>
      <div class="subtitle">
        Konsultasikan kebutuhan AI Anda, rancang dan deploy AI agent perusahaan&nbsp;hari&nbsp;ini.
      </div>
    </div>

    <div class="bottom">
      <div class="pills">
        <span class="pill">Konsultasi</span>
        <span class="pill">Desain</span>
        <span class="pill">Deploy</span>
        <span class="pill">Audit</span>
      </div>
      <div class="domain">klaut.id</div>
    </div>
  </div>
</body>
</html>
