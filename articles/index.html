<script type="module">
import { supabase, formatDate } from "/shared/supabase.js";

const grid = document.getElementById("article-grid");
function escapeHtml(s){ return String(s ?? "").replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

// Only show articles that have an English version (title_en not null/empty)
const { data, error } = await supabase
  .from("articles")
  .select("slug, title_en, excerpt_en, cover_image_url, published_at")
  .eq("published", true)
  .not("title_en", "is", null)
  .order("published_at", { ascending: false });

/* ---------- Card helpers (Klaut pricing-card chrome translated to articles) ---------- */
function monthBadge(iso){
  const d = new Date(iso);
  const m = d.toLocaleString("en-US", { month: "short" }).toUpperCase(); // JAN..DEC
  return `${m} ${d.getDate()}`;
}
function computeReadTime(excerpt){
  // Heuristic until DB stores reading_time: excerpt is ~10–15% of body, read at 200 wpm.
  if (!excerpt || !excerpt.trim()) return 1;
  const excerptWords = excerpt.trim().split(/\s+/).length;
  const estBodyWords = excerptWords * 8;
  return Math.max(1, Math.ceil(estBodyWords / 200));
}
function readTimeLabel(mins){
  if (mins < 1) return "&lt; 1 min read";
  return `${mins} min read`;
}
function renderCard(a, isFeatured){
  const badge = isFeatured ? "FEATURED" : monthBadge(a.published_at);
  const readMin = computeReadTime(a.excerpt_en);
  const time = readTimeLabel(readMin);

  const spanCls   = isFeatured ? "md:col-span-2 lg:col-span-2" : "";
  const ringCls   = isFeatured ? "card-featured" : "";
  const aspectCls = isFeatured ? "aspect-[21/9]" : "aspect-[16/9]";
  const titleCls  = isFeatured ? "text-2xl md:text-3xl" : "text-xl";
  const excerptClamp = isFeatured ? "line-clamp-4" : "line-clamp-3";
  const badgeCls = isFeatured
    ? "bg-accent text-white border-accent"
    : "bg-transparent text-accent-2 border-accent/30";

  return `
    <a href="/articles/${escapeHtml(a.slug)}"
       class="card ${spanCls} ${ringCls} block bg-surface border border-line rounded-2xl p-5 md:p-6">
      <div class="flex items-center justify-between">
        <span class="inline-flex items-center font-mono uppercase font-semibold text-[10px] tracking-wider px-2.5 py-1 rounded-full border ${badgeCls}">${badge}</span>
        <span class="card-circle inline-flex items-center justify-center w-6 h-6 rounded-full border border-linestrong text-dim">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </span>
      </div>

      ${a.cover_image_url
        ? `<div class="${aspectCls} mt-4 rounded-[10px] overflow-hidden bg-surface2"><img src="${escapeHtml(a.cover_image_url)}" alt="" class="w-full h-full object-cover"/></div>`
        : ""}

      <h2 class="mt-4 ${titleCls} font-bold leading-tight line-clamp-2">${escapeHtml(a.title_en)}</h2>
      ${a.excerpt_en ? `<p class="mt-3 text-sm text-muted leading-relaxed ${excerptClamp}">${escapeHtml(a.excerpt_en)}</p>` : ""}

      <div class="border-t border-dashed border-linestrong my-4"></div>

      <div class="font-mono text-[12px]">
        <span class="text-accent-2">${time}</span>
      </div>
    </a>
  `;
}

if (error) {
  grid.innerHTML = `<div class="card-empty col-span-full">Failed to load: ${escapeHtml(error.message)}</div>`;
} else {
  const filtered = data.filter(a => a.title_en && a.title_en.trim());
  if (!filtered.length) {
    grid.innerHTML = `<div class="card-empty col-span-full">No published articles yet — come back soon.</div>`;
  } else {
    grid.innerHTML = filtered.map((a, i) => renderCard(a, i === 0)).join("");
  }
}
</script>
