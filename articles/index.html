<body class="min-h-screen flex flex-col">

    </div>

</header>

<main class="flex-1">
  <section class="max-w-7xl mx-auto px-6 lg:px-10 pt-16 pb-10">
    <div class="text-xs font-mono uppercase tracking-widest text-accent-2 mb-3">Articles</div>

    <p class="mt-4 text-lg text-muted max-w-2xl">Thinking from the Klaut team on strategy, governance, and implementation of AI in Indonesian enterprises.</p>
  </section>

  <section class="max-w-7xl mx-auto px-6 lg:px-10 pb-24">
    <div id="article-grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="text-dim col-span-full text-center py-16">Loading articles…</div>
    </div>
  </section>
</main>

<footer class="border-t border-line">

    </div>
  </div>
</footer>

<script type="module">
import { supabase, formatDate } from "/shared/supabase.js";

const grid = document.getElementById("article-grid");
function escapeHtml(s){ return String(s ?? "").replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

// Only show articles that have an English version (title_en not null/empty)
const { data, error } = await supabase
  .from("articles")
  .select("slug, title_en, excerpt_en, cover_image_url, published_at")
  .eq("published", true)
  .not("title_en", "is", null)
  .order("published_at", { ascending: false });

if (error) {
  grid.innerHTML = `<div class="text-red-400 col-span-full text-center py-16">Failed to load: ${escapeHtml(error.message)}</div>`;
} else {
  const filtered = data.filter(a => a.title_en && a.title_en.trim());
  if (!filtered.length) {
    grid.innerHTML = `<div class="text-dim col-span-full text-center py-16">No published articles yet.</div>`;
  } else {
    grid.innerHTML = filtered.map(a => `
      <a href="/articles/${escapeHtml(a.slug)}" class="card block border border-line rounded-2xl bg-surface overflow-hidden">
        ${a.cover_image_url
          ? `<div class="aspect-[16/9] bg-surface2 overflow-hidden"><img src="${escapeHtml(a.cover_image_url)}" alt="" class="w-full h-full object-cover"/></div>`
          : `<div class="aspect-[16/9] bg-gradient-to-br from-surface2 to-surface flex items-center justify-center"><img src="/klaut-K.png" alt="" class="h-10 w-10 opacity-30"/></div>`}
        <div class="p-5">
          <div class="text-xs font-mono text-dim mb-2">${formatDate(a.published_at, "en-US")}</div>
          <h2 class="text-lg font-semibold leading-snug">${escapeHtml(a.title_en)}</h2>
          ${a.excerpt_en ? `<p class="mt-2 text-sm text-muted line-clamp-3">${escapeHtml(a.excerpt_en)}</p>` : ""}
          <div class="mt-4 text-sm text-accent-2">Read article →</div>
        </div>
      </a>
    `).join("");
  }
}
</script>
